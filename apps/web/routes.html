<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Map — Africana Airways</title>
  <meta name="description" content="Explore Africana Airways' interactive route map. 38 routes from two African hubs." />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ── Route Map Page Styles ── */
    .routes-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; height: calc(100vh - 76px); margin-top: 76px; }
    .route-sidebar { background: var(--white); border-right: 1px solid var(--gray-200); overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--gray-100); background: var(--dark); }
    .sidebar-title { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 800; color: var(--white); margin-bottom: 4px; }
    .sidebar-subtitle { font-size: 0.78rem; color: rgba(255,255,255,0.5); }
    .hub-toggle { display: flex; gap: 6px; padding: 12px 20px; background: var(--dark-700); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .hub-btn { flex: 1; padding: 8px; font-family: var(--font-heading); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: var(--radius-sm); border: 1.5px solid rgba(255,255,255,0.12); background: transparent; color: rgba(255,255,255,0.5); cursor: pointer; transition: var(--transition); }
    .hub-btn.active-maputo { background: var(--red-600); border-color: var(--red-600); color: var(--white); }
    .hub-btn.active-algiers { background: #5bb3e4; border-color: #5bb3e4; color: var(--white); }
    .hub-btn.active-all { background: var(--dark-600); border-color: var(--dark-600); color: var(--white); }
    .route-search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--gray-100); }
    .route-search { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 0.85rem; font-family: var(--font-body); color: var(--dark); }
    .route-search:focus { outline: none; border-color: var(--red-600); }
    .route-list { flex: 1; overflow-y: auto; }
    .route-group-label { padding: 10px 16px 6px; font-family: var(--font-heading); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-400); background: var(--gray-50); border-bottom: 1px solid var(--gray-100); position: sticky; top: 0; z-index: 1; }
    .route-item { padding: 14px 16px; border-bottom: 1px solid var(--gray-100); cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 12px; }
    .route-item:hover { background: var(--red-50); }
    .route-item.highlighted { background: var(--red-50); border-left: 3px solid var(--red-600); }
    .route-flag { font-size: 1.1rem; }
    .route-info { flex: 1; min-width: 0; }
    .route-cities { font-family: var(--font-heading); font-size: 0.88rem; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .route-meta { font-size: 0.72rem; color: var(--gray-400); margin-top: 2px; }
    .route-dist { font-family: var(--font-heading); font-size: 0.75rem; font-weight: 700; color: var(--dark); flex-shrink: 0; }
    .route-hub-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-maputo { background: var(--red-600); }
    .dot-algiers { background: #5bb3e4; }
    #mainMap { height: 100%; width: 100%; }
    /* Light fallback matching CartoDB Positron background colour */
    .leaflet-container { background: #f2f0eb !important; }
    .map-legend { position: absolute; bottom: 28px; right: 16px; background: rgba(0,0,0,0.85); border-radius: var(--radius-md); padding: 14px 18px; z-index: 500; backdrop-filter: blur(8px); }
    .legend-title { font-family: var(--font-heading); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
    .legend-line { width: 24px; height: 2px; border-radius: 1px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    @media (max-width: 768px) { .routes-layout { grid-template-columns: 1fr; height: auto; } .route-sidebar { height: 45vh; } #mainMap { height: 55vh; } }
  </style>
</head>
<body>

<nav class="navbar scrolled" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <img src="assets/img/Africana Airways With Logo.png" alt="Africana Airways" class="logo-img" />
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="routes.html" class="active">Routes</a></li>
      <li><a href="fleet.html">Fleet</a></li>
      <li><a href="vatsim.html">Live</a></li>
      <li><a href="ife.html">Entertainment</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-nav-login">Sign In</button>
      <a href="booking.html" class="btn-nav-book">Book Now</a>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="routes-layout">
  <!-- SIDEBAR -->
  <aside class="route-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Route Network</div>
      <div class="sidebar-subtitle" id="routeCount">Loading routes...</div>
    </div>
    <div class="hub-toggle">
      <button class="hub-btn active-all" onclick="filterHub('all', this)" id="btnAll">All Routes</button>
      <button class="hub-btn" onclick="filterHub('FQMA', this)" id="btnMaputo">Maputo Hub</button>
      <button class="hub-btn" onclick="filterHub('DAAG', this)" id="btnAlgiers">Algiers Hub</button>
    </div>
    <div class="route-search-wrap">
      <input class="route-search" type="text" placeholder="Search city or country..." id="routeSearchInput" />
    </div>
    <div class="route-list" id="routeList"></div>
  </aside>

  <!-- MAP -->
  <div style="position:relative; height:100%;">
    <div id="mainMap"></div>
    <div class="map-legend">
      <div class="legend-title">Legend</div>
      <div class="legend-item"><div class="legend-dot" style="background:#cc1f36;box-shadow:0 0 6px rgba(204,31,54,0.5)"></div> Maputo Hub (FQMA)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#5bb3e4;box-shadow:0 0 6px rgba(91,179,228,0.5)"></div> Algiers Hub (DAAG)</div>
      <div class="legend-item"><div class="legend-dot" style="background:white;"></div> Destination Airport</div>
      <div class="legend-item"><div class="legend-line" style="background:#cc1f36;"></div> Maputo Route</div>
      <div class="legend-item"><div class="legend-line" style="background:#5bb3e4;"></div> Algiers Route</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/live-map.js"></script>
</body>
</html>
